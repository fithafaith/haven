<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Haven</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="wrap" id="app">

    <section
      class="view" id="view-today" aria-label="Today">
    </section>

    <section
      class="view" id="view-music" aria-label="Listen" hidden>
    </section>

    <section
      class="view" id="view-write" aria-label="Write" hidden>
    </section>

    <section
      class="view" id="view-play" aria-label="Play" hidden>
    </section>

    <section
      class="view" id="view-reset" aria-label="Reset" hidden>
    </section>

  </main>

  <nav id="nav" aria-label="Main">

    <div class="in">

      <button
        data-act="tab"
        data-tab="today"
        aria-current="page">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>
        </svg>

        Today
      </button>


      <button
        data-act="tab"
        data-tab="music">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 15v-3a8 8 0 0 1 16 0v3"/>
          <rect x="3" y="14" width="4" height="6" rx="1.5"/>
          <rect x="17" y="14" width="4" height="6" rx="1.5"/>
        </svg>

        Listen
      </button>


      <button
        data-act="tab"
        data-tab="write">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 20l4-1L19 8a2.1 2.1 0 0 0-3-3L5 16l-1 4z"/>
        </svg>

        Write
      </button>


      <button
        data-act="tab"
        data-tab="play">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/>
          <path d="M19 15v5M16.5 17.5h5"/>
        </svg>

        Play
      </button>


      <button
        data-act="tab"
        data-tab="reset">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9h11a3 3 0 1 0-3-3M3 14h15a3 3 0 1 1-3 3M3 19h7"/>
        </svg>

        Reset
      </button>

    </div>
  </nav>


  <!-- WELCOME GATE -->
  <div
    class="gate"
    id="gate"
    role="dialog"
    aria-modal="true"
    aria-labelledby="gateTitle"
    hidden>
  </div>


  <!-- SHEET / MODAL -->
  <div
    class="sheet"
    id="sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="sheetTitle"
    hidden>

    <div class="sheet-in">

      <div class="sheet-bar">
        <button
          class="quiet"
          data-act="closeSheet"
          id="sheetClose">
          Close
        </button>
      </div>

      <div id="sheetBody"></div>

    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
